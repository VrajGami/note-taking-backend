<div class="container-fluid h-100">
  <div class="row h-100">

    <!-- Sidebar -->
    <div class="col-md-3 sidebar text-white p-0">
      <div class="p-3 d-flex flex-column h-100">

        <!-- Header -->
        <div class="d-flex align-items-center mb-4">
          <h4 class="mb-0"><i class="bi bi-journal-text me-2"></i> NoteTaker</h4>
        </div>

        <!-- User Info -->
        <div class="mb-4 pb-3 border-bottom border-secondary">
          <div class="d-flex align-items-center">
            <i class="bi bi-person-circle fs-3 me-2"></i>
            <div>
              <small class="text-light">Welcome back,</small>
              <div class="fw-bold">{{ currentUser?.email }}</div>
            </div>
          </div>
        </div>

        <!-- Search -->
        <div class="mb-3">
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-light">
              <i class="bi bi-search"></i>
            </span>
            <input
              type="text"
              class="form-control bg-dark border-secondary text-light"
              placeholder="Search notes..."
              (input)="onSearchChange($event)"
              [value]="searchQuery"
            />
          </div>
        </div>

        <!-- New Note -->
        <button class="btn btn-primary w-100 mb-3" (click)="onNewNote()">
          <i class="bi bi-plus-circle me-2"></i>
          New Note
        </button>

        <!-- Folder area -->
        <div class="flex-grow-1 d-flex flex-column" style="min-height:0;">
          <h6 class="text-uppercase text-muted small" style="color:white !important">Folders</h6>

          <button class="btn btn-outline-primary w-100 mb-2" (click)="onCreateFolder()">
            <i class="bi bi-folder-plus"></i> New Folder
          </button>

          <div class="folder-scroll-area flex-grow-1 overflow-auto" style="min-height:0;">
            <ul class="nav nav-pills flex-column">

              <!-- All Notes -->
              <li class="nav-item">
                <a class="nav-link text-light"
                   [class.active]="!selectedFolder"
                   (click)="onFolderSelected(null)"
                   (dragover)="onFolderDragOver($event)"
                   (drop)="onFolderDrop(null)"
                   style="cursor: pointer">
                  <i class="bi bi-journal me-2"></i> All Notes
                </a>
              </li>

              <!-- Root folders -->
              <ng-container *ngFor="let folder of folders">
                <li class="nav-item"
                    *ngIf="!folder.parent_folder_id"
                    [style.paddingLeft.px]="getFolderDepth(folder.folder_id) * 15">

                  <a class="nav-link text-light"
                     [class.active]="selectedFolder?.folder_id === folder.folder_id"
                     (click)="onFolderSelected(folder)"
                     (dragover)="onFolderDragOver($event)"
                     (drop)="onFolderDrop(folder)"
                     style="cursor:pointer">

                    <i class="bi bi-folder me-2"></i>
                    {{ folder.folder_name }}
                  </a>

                  <!-- Subfolders -->
                  <ng-container *ngTemplateOutlet="folderTemplate; context:{ parentId: folder.folder_id }"></ng-container>
                </li>
              </ng-container>

              <!-- recursive template -->
              <ng-template #folderTemplate let-parentId="parentId">
                <ng-container *ngFor="let sub of folders">
                  <li class="nav-item"
                      *ngIf="sub.parent_folder_id === parentId"
                      [style.paddingLeft.px]="getFolderDepth(sub.folder_id) * 15">

                    <a class="nav-link text-light"
                       [class.active]="selectedFolder?.folder_id === sub.folder_id"
                       (click)="onFolderSelected(sub)"
                       (dragover)="onFolderDragOver($event)"
                       (drop)="onFolderDrop(sub)"
                       style="cursor:pointer">

                      <i class="bi bi-folder me-2"></i>
                      {{ sub.folder_name }}
                    </a>

                    <ng-container *ngTemplateOutlet="folderTemplate; context:{ parentId: sub.folder_id }"></ng-container>
                  </li>
                </ng-container>
              </ng-template>

            </ul>
          </div>
        </div>

        <!-- Logout -->
        <div class="mt-auto pt-3 border-top border-secondary">
          <button class="btn btn-outline-light w-100" (click)="logout()">
            <i class="bi bi-box-arrow-right me-2"></i>
            Logout
          </button>
        </div>

      </div> <!-- END flex column -->
    </div> <!-- END sidebar -->

    <!-- ⭐⭐⭐ MAIN CONTENT MUST BE OUTSIDE SIDEBAR ⭐⭐⭐ -->
    <div class="col-md-9 p-0">
      <div class="row h-100">

        <!-- Notes List -->
        <div class="col-md-4 border-end bg-white p-3">
          <div class="d-flex justify-content-between mb-3">
            <h5>{{ selectedFolder ? selectedFolder.folder_name : "All Notes" }}</h5>
            <small class="text-muted">{{ getFilteredNotes().length }} notes</small>
          </div>

          <app-note-list
            [notes]="getFilteredNotes()"
            [selectedNote]="selectedNote"
            (noteSelected)="onNoteSelected($event)"
            (noteDeleted)="onNoteDeleted()">
          </app-note-list>
        </div>

        <!-- Note Editor -->
        <div class="col-md-8 bg-light">
          <app-note-editor
            [note]="selectedNote"
            [isCreating]="isCreatingNote"
            [folders]="folders"
            (noteSaved)="onNoteSaved($event)"
            (noteDeleted)="onNoteDeleted()"
            [selectedFolder]="selectedFolder">
          </app-note-editor>
        </div>

      </div>
    </div>

  </div> <!-- END row -->
</div> <!-- END container -->
